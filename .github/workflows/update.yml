name: Update Profile Panel

on:
  schedule:
    # 04:17 UTC. Deliberately offset: exactly-on-the-hour is the busiest
    # slot on GitHub's scheduler and runs sit in the queue.
    - cron: '17 4 * * *'
  workflow_dispatch:

# The bot only needs write access to this repository
permissions:
  contents: write

# Prevent a push race if a manual run overlaps the scheduled one
concurrency:
  group: profile-panel
  cancel-in-progress: false

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python update_readme.py

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "Panel unchanged, skipping commit."
          else
            git commit -m "chore(profile): refresh panel"
            git push
          fi
