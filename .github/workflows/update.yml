name: Profil Panelini Guncelle

on:
  schedule:
    # 04:17 UTC (TR 07:17). Tam saat basi GitHub'da en yogun dilim oldugu icin
    # kuyrukta beklememek adina kasitli olarak ofsetli bir saat secildi.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Bota sadece bu depoya yazma yetkisi
permissions:
  contents: write

# Elle tetikleme ile zamanlanmis calisma cakisirsa push yarisi olmasin
concurrency:
  group: profil-paneli
  cancel-in-progress: false

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Paneli olustur
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python update_readme.py

      - name: Degisikligi gonder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "Panelde degisiklik yok, commit atlandi."
          else
            git commit -m "chore(profil): panel guncellendi"
            git push
          fi
